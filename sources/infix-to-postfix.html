<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Infix to Postfix Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --highlight: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px;
        }

        h1 {
            color: var(--dark);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #infix-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border 0.3s;
        }

        #infix-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .visualization {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .visualization {
                flex-direction: row;
            }
        }

        .stack-container, .output-container {
            flex: 1;
            background: var(--light);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-bottom: 10px;
            color: var(--dark);
            font-size: 1.2rem;
        }

        .stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            min-height: 100px;
        }

        .stack-item {
            background: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .stack-item.operator {
            background: var(--secondary);
        }

        .stack-item.parenthesis {
            background: var(--danger);
        }

        .output-string {
            font-family: monospace;
            font-size: 1.2rem;
            padding: 10px;
            background: white;
            border-radius: 5px;
            min-height: 50px;
            word-break: break-word;
            animation: fadeIn 0.5s;
        }

        .steps-container {
            margin-top: 20px;
        }

        .step {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s;
        }

        .step.highlight {
            background: #fff9e6;
            border-left-color: var(--highlight);
        }

        .expression-display {
            font-family: monospace;
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            text-align: center;
        }

        .token {
            padding: 3px 6px;
            border-radius: 3px;
            margin: 0 2px;
            transition: all 0.3s;
        }

        .token.current {
            background: var(--highlight);
            color: white;
            transform: scale(1.1);
        }

        .token.operand {
            background: rgba(46, 204, 113, 0.2);
        }

        .token.operator {
            background: rgba(52, 152, 219, 0.2);
        }

        .token.parenthesis {
            background: rgba(231, 76, 60, 0.2);
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .highlight-step {
            animation: pop 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-code"></i> Infix to Postfix Converter</h1>
        
        <div class="input-section">
            <input type="text" id="infix-input" placeholder="Enter infix expression (e.g., A + B * C)" value="A + B * C">
            <button id="convert-btn"><i class="fas fa-exchange-alt"></i> Convert</button>
        </div>

        <div class="controls">
            <button id="prev-step" disabled><i class="fas fa-arrow-left"></i> Previous</button>
            <button id="next-step" disabled><i class="fas fa-arrow-right"></i> Next</button>
            <button id="reset-btn" disabled><i class="fas fa-redo"></i> Reset</button>
            <button id="auto-run"><i class="fas fa-play"></i> Auto Run</button>
            <button id="stop-auto" disabled><i class="fas fa-stop"></i> Stop</button>
        </div>

        <div class="expression-display" id="expression-display"></div>

        <div class="visualization">
            <div class="stack-container">
                <h3><i class="fas fa-layer-group"></i> Stack</h3>
                <div class="stack" id="stack-display">
                    <div class="stack-item" style="visibility: hidden;">Empty</div>
                </div>
            </div>
            <div class="output-container">
                <h3><i class="fas fa-long-arrow-alt-right"></i> Postfix Output</h3>
                <div class="output-string" id="output-display">(empty)</div>
            </div>
        </div>

        <div class="steps-container">
            <h3><i class="fas fa-list-ol"></i> Conversion Steps</h3>
            <div id="steps-display"></div>
        </div>
    </div>

    <script>
        // DOM Elements
        const infixInput = document.getElementById('infix-input');
        const convertBtn = document.getElementById('convert-btn');
        const prevStepBtn = document.getElementById('prev-step');
        const nextStepBtn = document.getElementById('next-step');
        const resetBtn = document.getElementById('reset-btn');
        const autoRunBtn = document.getElementById('auto-run');
        const stopAutoBtn = document.getElementById('stop-auto');
        const expressionDisplay = document.getElementById('expression-display');
        const stackDisplay = document.getElementById('stack-display');
        const outputDisplay = document.getElementById('output-display');
        const stepsDisplay = document.getElementById('steps-display');

        // State variables
        let expression = "";
        let currentStep = 0;
        let steps = [];
        let autoRunInterval = null;

        // Initialize
        function init() {
            expression = infixInput.value.trim();
            if (!expression) return;

            // Reset state
            currentStep = 0;
            steps = [];
            outputDisplay.textContent = "(empty)";
            stackDisplay.innerHTML = '<div class="stack-item" style="visibility: hidden;">Empty</div>';
            stepsDisplay.innerHTML = "";

            // Tokenize expression
            const tokens = expression.split(/([+\-*/^()])/).filter(token => token.trim() !== '');

            // Generate steps
            generateSteps(tokens);

            // Update UI
            updateUI();
        }

        // Generate all conversion steps
        function generateSteps(tokens) {
            let output = [];
            let stack = [];
            const precedence = { '^': 4, '*': 3, '/': 3, '+': 2, '-': 2, '(': 1 };

            // Initial step
            steps.push({
                action: "init",
                description: "Initialized empty stack and output",
                output: [...output],
                stack: [...stack],
                currentToken: null,
                tokens: tokens
            });

            // Process each token
            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i].trim();
                if (!token) continue;

                // Step: Processing token
                steps.push({
                    action: "process",
                    description: `Processing: "${token}"`,
                    output: [...output],
                    stack: [...stack],
                    currentToken: i,
                    tokens: tokens
                });

                if (/^[a-zA-Z0-9]$/.test(token)) {
                    // Operand - add to output
                    output.push(token);
                    steps.push({
                        action: "add-operand",
                        description: `"${token}" is an operand → added to output`,
                        output: [...output],
                        stack: [...stack],
                        currentToken: i,
                        tokens: tokens
                    });
                } 
                else if (token === '(') {
                    // Left parenthesis - push to stack
                    stack.push(token);
                    steps.push({
                        action: "push-parenthesis",
                        description: `"${token}" is left parenthesis → pushed to stack`,
                        output: [...output],
                        stack: [...stack],
                        currentToken: i,
                        tokens: tokens
                    });
                } 
                else if (token === ')') {
                    // Right parenthesis - pop until left parenthesis
                    steps.push({
                        action: "start-pop-parenthesis",
                        description: `"${token}" is right parenthesis → popping from stack until "("`,
                        output: [...output],
                        stack: [...stack],
                        currentToken: i,
                        tokens: tokens
                    });

                    while (stack.length > 0 && stack[stack.length - 1] !== '(') {
                        const op = stack.pop();
                        output.push(op);
                        steps.push({
                            action: "pop-operator",
                            description: `Popped "${op}" from stack → added to output`,
                            output: [...output],
                            stack: [...stack],
                            currentToken: i,
                            tokens: tokens
                        });
                    }

                    if (stack[stack.length - 1] === '(') {
                        stack.pop();
                        steps.push({
                            action: "remove-parenthesis",
                            description: `Found matching "(" → removed from stack`,
                            output: [...output],
                            stack: [...stack],
                            currentToken: i,
                            tokens: tokens
                        });
                    }
                } 
                else {
                    // Operator - handle precedence
                    steps.push({
                        action: "check-precedence",
                        description: `"${token}" is an operator (precedence ${precedence[token]}) → checking stack`,
                        output: [...output],
                        stack: [...stack],
                        currentToken: i,
                        tokens: tokens
                    });

                    while (stack.length > 0 && precedence[stack[stack.length - 1]] >= precedence[token]) {
                        const op = stack.pop();
                        output.push(op);
                        steps.push({
                            action: "pop-higher-precedence",
                            description: `Popped "${op}" (higher precedence) → added to output`,
                            output: [...output],
                            stack: [...stack],
                            currentToken: i,
                            tokens: tokens
                        });
                    }

                    stack.push(token);
                    steps.push({
                        action: "push-operator",
                        description: `Pushed "${token}" to stack`,
                        output: [...output],
                        stack: [...stack],
                        currentToken: i,
                        tokens: tokens
                    });
                }
            }

            // Pop remaining operators
            steps.push({
                action: "start-final-pop",
                description: "End of expression → popping remaining operators",
                output: [...output],
                stack: [...stack],
                currentToken: null,
                tokens: tokens
            });

            while (stack.length > 0) {
                const op = stack.pop();
                output.push(op);
                steps.push({
                    action: "pop-remaining",
                    description: `Popped "${op}" → added to output`,
                    output: [...output],
                    stack: [...stack],
                    currentToken: null,
                    tokens: tokens
                });
            }

            // Final step
            steps.push({
                action: "complete",
                description: `Conversion complete! Postfix expression: ${output.join(' ')}`,
                output: [...output],
                stack: [...stack],
                currentToken: null,
                tokens: tokens
            });
        }

        // Update UI based on current step
        function updateUI() {
            if (steps.length === 0 || currentStep >= steps.length) return;

            const step = steps[currentStep];

            // Update expression display with current token highlight
            expressionDisplay.innerHTML = '';
            step.tokens.forEach((token, index) => {
                const span = document.createElement('span');
                span.className = `token ${/^[a-zA-Z0-9]$/.test(token) ? 'operand' : 
                                 token === '(' || token === ')' ? 'parenthesis' : 'operator'} ${index === step.currentToken ? 'current' : ''}`;
                span.textContent = token;
                expressionDisplay.appendChild(span);
            });

            // Update stack display
            stackDisplay.innerHTML = '';
            if (step.stack.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'stack-item';
                empty.textContent = "(empty)";
                empty.style.background = "transparent";
                empty.style.color = "#777";
                stackDisplay.appendChild(empty);
            } else {
                step.stack.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `stack-item ${item === '(' || item === ')' ? 'parenthesis' : 'operator'}`;
                    div.textContent = item;
                    stackDisplay.appendChild(div);
                });
            }

            // Update output display
            outputDisplay.textContent = step.output.join(' ') || "(empty)";

            // Update steps display
            stepsDisplay.innerHTML = '';
            steps.slice(0, currentStep + 1).forEach((s, i) => {
                const stepEl = document.createElement('div');
                stepEl.className = `step ${i === currentStep ? 'highlight' : ''}`;
                stepEl.textContent = s.description;
                stepsDisplay.appendChild(stepEl);
            });

            // Scroll to latest step
            if (stepsDisplay.lastChild) {
                stepsDisplay.lastChild.scrollIntoView({ behavior: 'smooth' });
            }

            // Update button states
            updateButtons();
        }

        // Update button states
        function updateButtons() {
            prevStepBtn.disabled = currentStep <= 0;
            nextStepBtn.disabled = currentStep >= steps.length - 1;
            resetBtn.disabled = steps.length === 0;
            convertBtn.disabled = false;

            if (autoRunInterval) {
                autoRunBtn.disabled = true;
                stopAutoBtn.disabled = false;
            } else {
                autoRunBtn.disabled = false;
                stopAutoBtn.disabled = true;
            }
        }

        // Event Listeners
        convertBtn.addEventListener('click', () => {
            if (autoRunInterval) {
                clearInterval(autoRunInterval);
                autoRunInterval = null;
            }
            init();
        });

        prevStepBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        nextStepBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateUI();
            }
        });

        resetBtn.addEventListener('click', () => {
            if (autoRunInterval) {
                clearInterval(autoRunInterval);
                autoRunInterval = null;
            }
            currentStep = 0;
            updateUI();
        });

        autoRunBtn.addEventListener('click', () => {
            if (autoRunInterval) clearInterval(autoRunInterval);
            
            autoRunInterval = setInterval(() => {
                if (currentStep < steps.length - 1) {
                    currentStep++;
                    updateUI();
                } else {
                    clearInterval(autoRunInterval);
                    autoRunInterval = null;
                    updateButtons();
                }
            }, 1500);

            updateButtons();
        });

        stopAutoBtn.addEventListener('click', () => {
            if (autoRunInterval) {
                clearInterval(autoRunInterval);
                autoRunInterval = null;
                updateButtons();
            }
        });

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
